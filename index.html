<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CACOMM – Accesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sfondo animato: gradiente (CSS) + particelle (canvas/JS) -->
  <div class="bg-gradient" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <main class="card">
    <div class="logos">
      <img src="assets/logo_primario (2).png" alt="Logo 1" class="logo">
      <span class="divider" aria-hidden="true"></span>
      <img src="assets/Logo_governo_Regione_Campania.png" alt="Logo 2" class="logo">
    </div>
<h1>CA Comm</h1>

    <button id="login-btn" class="btn" type="button">
      <span class="btn-label">Accedi</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>
    </main>

  <footer class="footer">
    <img src="assets/verdesenzatesto.svg" alt="" class="footer-logo">
    <span>CID Software 2026</span>
  </footer>
  

    

  <script src="script.js"></script>
</body>
</html>
